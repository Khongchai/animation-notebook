<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      html,
      body {
        border: 0;
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body style="background: black">
    <div>
      <canvas id="canvas"></canvas>
    </div>
  </body>
  <script>
    // @ts-check
    // Not used in the example below.
    let last = /** @type {number | null} */ (null);
    function draw(/** @type {(t: number) => void} */ callback) {
      requestAnimationFrame((next) => {
        if (last == null) {
          last = next;
        }
        const dt = next - last;
        last = next;
        const timeSinceLastFrameSeconds = dt / 1000;
        callback(Math.min(timeSinceLastFrameSeconds, 0.1));
        draw(callback);
      });
    }
  </script>
  <script>
    const canvas = /** @type {HTMLCanvasElement} */ (
      document.getElementById("canvas")
    );
    const w = window.innerWidth * devicePixelRatio;
    const h = window.innerHeight * devicePixelRatio;
    canvas.width = w;
    canvas.height = h;
    const ctx = /** @type {CanvasRenderingContext2D} */ (
      canvas.getContext("2d")
    );

    const radius = 200;

    // velocity
    let omega = Math.PI * 2;
    // acceleration
    let alpha = Math.PI * 2 * (1 / 10);
    let friction = Math.PI * 2 * (5 / 10);
    let angle = 0;
    const drag = 0.6;

    let count = 0;
    draw((dt) => {
      // note to self, drag multiples omega because it depends on velocity
      const brake = friction;
      const _drag = drag * omega;
      const drive = alpha;
      const netAlpha = drive - (brake + _drag);
      omega += netAlpha * dt;
      omega = Math.max(0, omega);
      angle = angle + omega * dt;

      ctx.clearRect(0, 0, w, h);

      // circle
      // doesn't have anything to do with the rotation I'm about to try out
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "white";
      ctx.stroke();

      // spokes
      // const balls = [{
      //   mass: 1,
      //   distance:
      // }]
      const spokesCount = 4;
      for (let i = 0; i < spokesCount; i++) {
        const spokeAngle = (i / spokesCount) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(w / 2, h / 2);
        ctx.lineTo(
          Math.cos(angle + spokeAngle) * radius + w / 2,
          Math.sin(angle + spokeAngle) * radius + h / 2,
        );
        if (i === 0) {
          ctx.strokeStyle = "green";
          ctx.lineWidth = 10;
        } else {
          ctx.strokeStyle = "white";
          ctx.lineWidth = 1;
        }
        ctx.stroke();
      }
    });
  </script>
  <!-- Visualization area by claude -->
  <script>
    // Reads α, αNeg, ω, angle from the script above (top-level `let`s are
    // shared between classic <script> tags) and plots their full history.
    (() => {
      const GRAPH_HEIGHT = 0.4; // fraction of the screen height
      const MAX_SAMPLES = 2000; // thin out history past this to stay fast

      // Overlay canvas pinned to the bottom of the screen
      const gc = document.createElement("canvas");
      gc.style.cssText =
        "position:fixed;left:0;bottom:0;width:100%;" +
        `height:${GRAPH_HEIGHT * 100}%;pointer-events:none;`;
      document.body.appendChild(gc);
      const g = /** @type {CanvasRenderingContext2D} */ (gc.getContext("2d"));
      const dpr = devicePixelRatio;

      function resize() {
        gc.width = gc.clientWidth * dpr;
        gc.height = gc.clientHeight * dpr;
      }
      resize();
      addEventListener("resize", resize);

      const panels = [
        {
          title: "α (rad/s²)",
          lines: [
            { name: "drive α", color: "#ff6b6b", get: () => alpha },
            { name: "net α", color: "#ffa94d", get: () => netAlpha },
          ],
        },
        {
          title: "ω (rad/s)",
          lines: [{ name: "ω", color: "#4dabf7", get: () => omega }],
        },
        {
          title: "angle (rad)",
          lines: [{ name: "angle", color: "#69db7c", get: () => angle }],
        },
      ];

      /** @type {{ t: number, v: number[][] }[]} */
      let samples = [];
      let t0 = /** @type {number | null} */ (null);
      let prevNow = /** @type {number | null} */ (null);
      let prevOmega = omega;
      let netAlpha = 0;

      function frame(/** @type {number} */ now) {
        if (t0 == null) t0 = now;
        const t = (now - t0) / 1000;

        if (prevNow != null) {
          const step = Math.min((now - prevNow) / 1000, 0.1);
          if (step > 0) netAlpha = (omega - prevOmega) / step;
        }
        prevNow = now;
        prevOmega = omega;

        samples.push({
          t,
          v: panels.map((p) => p.lines.map((l) => l.get())),
        });

        // Keep every other point once we have too many (always keep the newest)
        if (samples.length > MAX_SAMPLES) {
          const lastIndex = samples.length - 1;
          samples = samples.filter((_, i) => i % 2 === 0 || i === lastIndex);
        }

        render(t);
        requestAnimationFrame(frame);
      }

      function render(/** @type {number} */ t) {
        const W = gc.width;
        const H = gc.height;
        g.clearRect(0, 0, W, H);
        g.fillStyle = "rgba(0,0,0,0.75)";
        g.fillRect(0, 0, W, H);

        const pad = 10 * dpr;
        const labelW = 70 * dpr;
        const panelH = H / panels.length;
        const font = 12 * dpr;
        g.font = `${font}px system-ui, sans-serif`;
        g.textBaseline = "middle";

        // Time axis always spans 0 → now
        const tSpan = Math.max(t, 1e-6);

        panels.forEach((panel, pi) => {
          const top = pi * panelH + pad;
          const bottom = (pi + 1) * panelH - pad;
          const left = labelW;
          const right = W - pad;
          const plotH = bottom - top;
          const plotW = right - left;

          // y range: fit all data, always include 0
          let min = 0;
          let max = 0;
          for (const s of samples) {
            for (const v of s.v[pi]) {
              if (v < min) min = v;
              if (v > max) max = v;
            }
          }
          if (max - min < 1e-6) {
            max += 1;
            min -= 1;
          }
          const margin = (max - min) * 0.1;
          max += margin;
          min -= margin;

          const yOf = (/** @type {number} */ v) =>
            bottom - ((v - min) / (max - min)) * plotH;
          const xOf = (/** @type {number} */ st) => left + (st / tSpan) * plotW;

          // frame
          g.strokeStyle = "rgba(255,255,255,0.15)";
          g.lineWidth = 1 * dpr;
          g.setLineDash([]);
          g.strokeRect(left, top, plotW, plotH);

          // zero line
          g.strokeStyle = "rgba(255,255,255,0.35)";
          g.setLineDash([4 * dpr, 4 * dpr]);
          g.beginPath();
          g.moveTo(left, yOf(0));
          g.lineTo(right, yOf(0));
          g.stroke();
          g.setLineDash([]);

          // axis numbers
          g.fillStyle = "rgba(255,255,255,0.5)";
          g.textAlign = "right";
          g.fillText(max.toFixed(2), left - 6 * dpr, top + font / 2);
          g.fillText(min.toFixed(2), left - 6 * dpr, bottom - font / 2);
          g.fillText("0", left - 6 * dpr, yOf(0));

          // time labels on the bottom panel
          if (pi === panels.length - 1) {
            g.textAlign = "left";
            g.fillText("0s", left + 4 * dpr, bottom - font / 2);
            g.textAlign = "right";
            g.fillText(`${t.toFixed(1)}s`, right - 4 * dpr, bottom - font / 2);
          }

          // lines
          panel.lines.forEach((line, li) => {
            g.strokeStyle = line.color;
            g.lineWidth = 2 * dpr;
            g.beginPath();
            samples.forEach((s, i) => {
              const x = xOf(s.t);
              const y = yOf(s.v[pi][li]);
              if (i === 0) g.moveTo(x, y);
              else g.lineTo(x, y);
            });
            g.stroke();
          });

          // title + live values
          g.textAlign = "left";
          g.fillStyle = "white";
          let x = left + 8 * dpr;
          const y = top + font;
          g.fillText(panel.title, x, y);
          x += g.measureText(panel.title).width + 16 * dpr;
          panel.lines.forEach((line) => {
            const text = `${line.name} = ${line.get().toFixed(3)}`;
            g.fillStyle = line.color;
            g.fillText(text, x, y);
            x += g.measureText(text).width + 16 * dpr;
          });
        });
      }

      requestAnimationFrame(frame);
    })();
  </script>
</html>
