<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      html,
      body {
        border: 0;
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body style="background: black">
    <div>
      <canvas id="canvas"></canvas>
    </div>
  </body>
  <script>
    // @ts-check
    // Not used in the example below.
    let last = /** @type {number | null} */ (null);
    function draw(/** @type {(t: number) => void} */ callback) {
      requestAnimationFrame((next) => {
        if (last == null) {
          last = next;
        }
        const dt = next - last;
        last = next;
        const timeSinceLastFrameSeconds = dt / 1000;
        callback(timeSinceLastFrameSeconds);
        draw(callback);
      });
    }
  </script>
  <script>
    const canvas = /** @type {HTMLCanvasElement} */ (
      document.getElementById("canvas")
    );
    const w = window.innerWidth * devicePixelRatio;
    const h = window.innerHeight * devicePixelRatio;
    canvas.width = w;
    canvas.height = h;
    const ctx = /** @type {CanvasRenderingContext2D} */ (
      canvas.getContext("2d")
    );

    const radius = 200;

    let angle = 0;

    // velociy in radians per second.
    let ω = Math.PI * 2;
    let α = 0;

    let count = 0;
    draw((dt) => {
      angle += ω * dt;

      ctx.clearRect(0, 0, w, h);

      // circle
      // doesn't have anything to do with the rotation I'm about to try out
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "white";
      ctx.stroke();

      // spokes
      const spokesCount = 4;
      for (let i = 0; i < spokesCount; i++) {
        const spokeAngle = (i / spokesCount) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(w / 2, h / 2);
        ctx.lineTo(
          Math.cos(angle + spokeAngle) * radius + w / 2,
          Math.sin(angle + spokeAngle) * radius + h / 2,
        );
        if (i === 0) {
          ctx.strokeStyle = "green";
          ctx.lineWidth = 10;
        } else {
          ctx.strokeStyle = "white";
          ctx.lineWidth = 1;
        }
        ctx.stroke();
      }
    });
  </script>
</html>
